name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}
        run: |
          if [ -z "$VITE_APP_PASSWORD" ]; then
            echo "::error::Set the VITE_APP_PASSWORD repository secret before deploying."
            exit 1
          fi
          npm run build -- --base=./
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
